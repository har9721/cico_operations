name: New CI Workflow

on:
  push:
    branches: ['dev', 'master']
  
  pull_request:
    branches: ['dev']

jobs:
  laravel-tests:

    runs-on:  ubuntu-latest

    services:
      mysql:
        image: mysql:8.0    

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: testing_user
          MYSQL_PASSWORD: testing_password

        ports:
          - 3306:3306

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: testing_user
      DB_PASSWORD: testing_password

    steps:
      # ------------------------
      # Checkout code
      # ------------------------

      - name: check out repository code
        uses: actions/checkout@v4

      # ------------------------
      # Set up PHP & Extensions
      # ------------------------

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, ctype, fileinfo, json, tokenizer, xml, pdo, pdo_mysql, openssl, curl, zip, imagick

      # ------------------------
      # Composer Install
      # ------------------------

      - name: Install Depedencies
        run: composer install --no-interaction --prefer-dist -vvv

      # ------------------------
      # Code Quality Checks
      # ------------------------

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

      # ------------------------
      # Laravel Environment Setup
      # ------------------------

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Clear Laravel cache
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Directory Permissions
        run: chmod -R 775 storage bootstrap/cache

      # ------------------------
      # Generate JWT secret
      # ------------------------

      - name: Generate JWT secret
        run: php artisan jwt:secret --force

      # ------------------------
      # Tests
      # ------------------------

      - name: Run Test Suite
        run: php artisan test
  