name: New CI Workflow

on:
  push:
    branches: ['dev', 'master']
  
  pull_request:
    branches: ['dev']

jobs:
  laravel-tests:

    runs-on:  ubuntu-latest

    services:
      mysql:
        image: mysql:8.0    

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: testing_user
          MYSQL_PASSWORD: testing_password

        ports:
          - 3306:3306

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: testing_user
      DB_PASSWORD: testing_password

    steps:
      # Step 1: Download your laravel code onto the runner
      - name: check out repository code
        uses: actions/checkout@v4

      # Step 2: set up php8.2 & composer on the runner
      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, ctype, fileinfo, json, tokenizer, xml, pdo, pdo_mysql, openssl, curl, zip, imagick,

      # Step 3: Install Composer Depedencies
      - name: Install Depedencies
        run: composer install --no-interaction --prefer-dist -vvv

      # Step 4: Copy Laravel.env file
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Step 5: Generate JWT secret if you don't want to use GitHub Secret
      - name: Generate JWT secret
        run: php artisan jwt:secret --force

      # Step 6: Run the migrations
      - name: Run migrations
        run: php artisan migrate

      # Step 7. Clear Laravel configuration/cache
      - name: Clear Laravel cache
        run: |
          php artisan config:clear
          php artisan cache:clear

      # Step 8: Execute Laravel Test
      - name: Run Test Suite
        run: php artisan test
  